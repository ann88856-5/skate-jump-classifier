version: '3.8'

services:
  # Сервис бэкенда (Python)
  backend:
    build: .  # Собираем из Dockerfile в текущей директории
    ports:
      - "5000:5000" # Пробрасываем порт (если ваше приложение слушает 8000, измените на "8000:8000")
    volumes:
      - .:/app # Монтируем папку с кодом для удобной разработки (изменения видны без пересборки)
    environment:
      - FLASK_ENV=development # Пример переменной окружения (если используете Flask)
    # depends_on:
    #   - db # Раскомментируйте, если добавите базу данных

  # Сервис фронтенда (React)
  frontend:
    build: ./frontend # Собираем из Dockerfile в папке frontend
    ports:
      - "3000:80" # Наружу отдаем порт 3000, внутри контейнера Nginx слушает 80
    depends_on:
      - backend # Запускаем фронтенд только после старта бэкенда